<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cribalicious</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky brand bar over a single centered column; each "screen" is a view swapped by the URL hash. */
:root{
  /* "Warm & Trustworthy" palette: navy #1E40AF primary, terracotta #E06D53 accent, alabaster #FAF8F5 bg,
     charcoal #1F2937 / slate #4B5563 text, mint #DCFCE7 + forest #166534 savings. Single light theme by choice. */
  --bg:#FAF8F5; --surface:#ffffff; --ink:#1F2937; --muted:#4B5563; --line:#E5E7EB;
  --sage:#1E40AF; --mintc:#DBEAFE; --gold:#F6C9BD;
  --pink:#E06D53; --pink-shade:#E06D53; --pink-ink:#A8432C; --pink-soft:#FBE3DC;
  --blue:#1E40AF; --blue-soft:#DBEAFE;
  --good:#166534; --good-soft:#DCFCE7; --warn:#A8432C; --warn-soft:#FBE3DC;
  --save-bg:#DCFCE7; --save-ink:#166534;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;color:var(--blue)}
h1 .pop{color:var(--ink);background:linear-gradient(transparent 62%,var(--gold) 62%);padding-inline:2px}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* demo ribbon + header */
.ribbon{background:var(--ink);color:#fff;font-size:.82rem;font-weight:700;text-align:center;padding-block:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sage)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:2px;line-height:0;position:relative;text-decoration:none}
.logo .mark{position:relative;display:block;height:54px;aspect-ratio:182/227}
.logo .bigc{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:70px;line-height:1;color:var(--pink);--cy:-8px;opacity:0;transform:translateY(var(--cy,0px)) scale(.6);transition:opacity .35s .45s,transform .35s .45s}
.logo .pram{position:absolute;inset:0;height:100%;width:100%;z-index:1;transition:transform 1.1s cubic-bezier(.5,0,.4,1),opacity .3s .8s}
.logo .word{display:grid;font-family:var(--display);font-weight:700;line-height:.95;letter-spacing:.5px;position:relative;z-index:0}
.logo .w1{color:var(--sage);font-size:30px}.logo .w1 small{font-size:.8em;margin-left:10px}
.logo .w2{color:var(--pink);font-size:30px}
.logo:hover .pram,.logo.rolled .pram{transform:translateX(230px);opacity:0;animation:wobble .25s linear 4}
.logo:hover .bigc,.logo.rolled .bigc{opacity:1;transform:translateY(var(--cy,0px)) scale(1)}
@keyframes wobble{0%,100%{rotate:0deg}50%{rotate:-4deg}}
@media (prefers-reduced-motion:reduce){.logo .pram,.logo .bigc{transition:opacity .2s}.logo:hover .pram,.logo.rolled .pram{transform:none;animation:none}}
nav{margin-left:auto;display:flex;gap:4px;align-items:center}
nav a{white-space:nowrap;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700}
nav a.on{background:var(--blue-soft);color:var(--blue)}
.cartbtn{display:flex;align-items:center;gap:6px}
.badge{background:var(--pink);color:#1F2937;border-radius:999px;font-size:.75rem;padding:0 7px;font-weight:800;min-width:20px;text-align:center}
@media (max-width:560px){.logo .mark{height:36px}.logo .w1,.logo .w2{font-size:19px}.logo .bigc{font-size:46px;--cy:-6px}.logo:hover .pram,.logo.rolled .pram{transform:translateX(150px)} nav{gap:0} nav a{padding:8px 7px;font-size:.9rem}}

main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:800;cursor:pointer;text-decoration:none;font-size:1rem}
.btn.primary{background:var(--blue);color:#fff}
.btn.pink{background:var(--pink);color:#1F2937}
.btn.ghost{background:rgb(255 255 255 / .65);border:2px solid var(--blue);color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:8px 14px;font-size:.9rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-ink)}
.panel{background:var(--surface);border:1px solid rgb(255 255 255 / .7);box-shadow:0 2px 10px rgb(30 64 175 / .08);border-radius:var(--r);padding:20px}

/* home */
.hero{padding-block:clamp(8px,3vw,28px);display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.hero p.lead{font-size:1.15rem;margin-top:12px;max-width:34ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero .art svg{width:100%;max-width:320px;height:auto;display:block;margin:auto}
.quote{margin-top:18px;font-style:italic;color:var(--ink);opacity:.85}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .art{order:-1}.hero .art svg{max-width:200px}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{display:grid;gap:6px}
.step b{font-family:var(--display);font-size:1.05rem}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--pink-soft);color:var(--pink-ink);display:grid;place-items:center;font-weight:800}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.steps{grid-template-columns:1fr}}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:720px){.why{grid-template-columns:1fr}}
.why div{display:grid;gap:4px}
.compare{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}

/* catalog */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid rgb(255 255 255 / .7);box-shadow:0 2px 10px rgb(30 64 175 / .08);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .pic{background:var(--blue-soft);aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.card .pic svg{width:46%;height:auto}
.card .body{padding:14px 16px 16px;display:grid;gap:4px}
.card .price{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.card .price b{font-size:1.15rem}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--good-soft);color:var(--good)}

/* item */
.item{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.item{grid-template-columns:1fr}}
.item .pic{background:var(--blue-soft);border-radius:24px;aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.item .pic svg{width:55%;height:auto}
.item .info{display:grid;gap:16px;min-width:0}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span span{background:none;border:0;padding:0}
.facts > span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:700}
.slider{display:grid;gap:10px}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.stops{display:grid;grid-template-columns:repeat(6,1fr);font-size:.78rem;font-weight:700;color:var(--muted);text-align:center}
.stops span:first-child{text-align:left}.stops span:last-child{text-align:right}
.quoteBox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quoteBox .big{font-family:var(--display);font-size:2.2rem;font-weight:700;color:var(--blue)}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--pink);border-radius:999px;transition:width .2s}
.save{background:var(--save-bg);color:var(--save-ink);border-radius:12px;padding:10px 14px;font-weight:800}
.deliv{font-size:.92rem;border-radius:12px;padding:10px 14px}
.deliv.free{background:var(--good-soft);color:var(--good)}
.deliv.fee{background:var(--warn-soft);color:var(--warn)}

/* cart & checkout */
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .mini{width:64px;height:64px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center}
.line .mini svg{width:38px;height:38px}
.line > div{min-width:0}
.linkbtn{background:none;border:0;color:var(--pink-ink);font-weight:700;cursor:pointer;padding:0;font-size:.88rem}
.sum{display:grid;gap:10px}
.sum .row{display:flex;justify-content:space-between;gap:10px}
.sum .total{font-weight:800;font-size:1.2rem;border-top:1px solid var(--line);padding-top:10px}
form{display:grid;gap:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input[type=text],input[type=date],input[type=email],select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
input:focus,select:focus{border-color:var(--blue);outline:none}
.err{color:var(--pink-ink);font-size:.85rem;font-weight:700}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots label{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700}
.slots input{accent-color:var(--blue)}
.fakepay{display:flex;gap:10px;align-items:center;background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}

/* confirmation */
.confirm{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:20px}
.confirm .check{width:84px;height:84px;border-radius:50%;background:var(--good-soft);display:grid;place-items:center}
.timeline{display:grid;gap:0;max-width:520px;width:100%;text-align:left}
.timeline div{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px;position:relative}
.timeline div::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--pink);margin:5px auto 0}
.timeline div:not(:last-child)::after{content:"";position:absolute;left:13px;top:22px;bottom:0;width:2px;background:var(--line)}

/* rentals */
.rentals{display:grid;gap:14px}
.rental{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center}
@media (max-width:640px){.rental{grid-template-columns:56px 1fr}.rental .acts{grid-column:1/-1}}
.rental .mini{width:72px;height:72px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center}
.rental .mini svg{width:44px;height:44px}
@media (max-width:640px){.rental .mini{width:56px;height:56px}}
.rental > div{min-width:0;display:grid;gap:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status{font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:999px}
.status.active{background:var(--good-soft);color:var(--good)}
.status.soon{background:var(--warn-soft);color:var(--warn)}
.status.done{background:var(--line);color:var(--muted)}
.status.sched{background:var(--blue-soft);color:var(--blue)}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}

/* modal */
.scrim{position:fixed;inset:0;background:rgb(10 20 40 / .45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:24px;max-width:460px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.opt input{accent-color:var(--blue)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
footer{border-top:1px solid rgb(255 255 255 / .6);padding-block:24px;font-size:.88rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="ribbon">Class demo: nothing here is a real order. Prices are estimates from our pricing research.</div>
<header><div class="wrap">
  <a class="logo" href="#home" aria-label="Crying for Cribalicious, home"><span class="mark" aria-hidden="true"><span class="bigc">C</span><img class="pram" src="pram.svg" alt="" width="182" height="227"></span><span class="word" aria-hidden="true"><b class="w1">RYING <small>FOR</small></b><b class="w2">RIBALICIOUS</b></span></a>
  <nav>
    <a href="#gear" data-nav="gear">Gear</a>
    <a href="#rentals" data-nav="rentals">My rentals</a>
    <a href="#cart" data-nav="cart" class="cartbtn">Cart <span class="badge num" id="cartCount">0</span></a>
  </nav>
</div></header>

<main class="wrap"><div id="app"></div></main>
<footer><div class="wrap">Cribalicious · Baby gear rentals delivered in Washington, DC · A student business concept. Demo only: no accounts, payments or real deliveries.</div></footer>
<div id="layer"></div>

<!-- Icon sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <symbol id="i-pram" viewBox="0 0 48 48"><g fill="none" stroke="#B4483A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h30a0 0 0 0 1 0 0 15 10 0 0 1-15 10 15 10 0 0 1-15-10z" fill="#E06D53"/><path d="M23 20V7a13 13 0 0 1 13 13z" fill="#F2B3A4"/><path d="M38 20l4-6"/><circle cx="14" cy="38" r="4" fill="#fff"/><circle cx="32" cy="38" r="4" fill="#fff"/><path d="M28 9l4 11M31 12l3 8"/></g></symbol>

  <symbol id="i-highchair" viewBox="0 0 64 64"><g fill="none" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6h20v22H22z" fill="#fff"/><path d="M14 30h36" stroke="#E06D53" stroke-width="5"/><path d="M20 34h24v6H20z" fill="#fff"/><path d="M22 40l-8 18M42 40l8 18M18 50h28"/></g></symbol>

 </defs>
</svg>

<script>
/* ======================================================
   EDIT PRICES HERE. Everything else reads from these.
   Prices come from the "Cribalicious Rental Pricing" research doc.
   prices = total price for the whole rental at each length.
   Leave a length out to mean "not offered" (outgrown / short-term only).
   retail = price to buy the item new.
   ====================================================== */
const TIERS = [
  {id:"2w",  label:"2 weeks",  short:"2w",  months:0.5},
  {id:"1m",  label:"1 month",  short:"1m",  months:1},
  {id:"3m",  label:"3 months", short:"3m",  months:3},
  {id:"6m",  label:"6 months", short:"6m",  months:6},
  {id:"12m", label:"1 year",   short:"1y",  months:12},
  {id:"24m", label:"2 years",  short:"2y",  months:24},
];
const CAP = 0.60;  // a customer never pays more than 60% of retail; at the cap, the item is theirs to keep
const DELIVERY = { each: 25, freeFromMonths: 3, freeOverSubtotal: 150 }; // $25 drop-off + $25 pickup on short orders

const GEAR = [
  {id:"bundle",    name:"Newborn Bundle",   cat:"Bundles", icon:"i-bundle", retail:null, prices:{"6m":490}, ages:"0 to 6 months",
   includes:["bassinet","swing","carrier","stroller"], desc:"Everything for the first six months in one delivery: bedside bassinet, baby swing, soft carrier and premium stroller. Set up in your home before the baby arrives.", popular:true},

/* ---------- pricing ---------- */
const gear = id => GEAR.find(g=>g.id===id);
const tier = id => TIERS.find(t=>t.id===id);
const retailOf = g => g.retail ?? g.includes.reduce((a,id)=>a+gear(id).retail,0);
const tiersFor = g => TIERS.filter(t=>g.prices[t.id]!=null);
const rentPrice = (g,t) => g.prices[t.id];
const hitsCap = (g,t) => !g.includes && rentPrice(g,t) >= Math.round(retailOf(g)*CAP)-1;
const money = n => "$" + n.toLocaleString("en-US",{maximumFractionDigits:0});
const lowestMonthly = g => { const ts=tiersFor(g).filter(t=>t.months>=1); const t=ts[ts.length-1]||tiersFor(g)[0]; return Math.round(rentPrice(g,t)/Math.max(1,t.months)); };

/* ---------- state (in memory only) ---------- */
const today = new Date(); today.setHours(0,0,0,0);
const addDays = (d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const addMonths = (d,m)=>{const x=new Date(d); if(m<1){x.setDate(x.getDate()+Math.round(m*30));} else x.setMonth(x.getMonth()+m); return x;};
const fmtDate = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const iso = d => d.toISOString().slice(0,10);

const shortItems = items => items.filter(i=>tier(i.tier).months < DELIVERY.freeFromMonths);
function deliveryFee(items){ if(!items.length) return 0; if(subtotal(items) > DELIVERY.freeOverSubtotal) return 0; return shortItems(items).length ? DELIVERY.each*2 : 0; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- router ---------- */
function render(){
  const h=(location.hash||"#home").slice(1);
  let html, key=h;
  if(h.startsWith("item-")){ html=views.item(h.slice(5)); key="gear"; }
  else if(views[h]) html=views[h]();
  else { html=views.home(); key="home"; }
  $("#app").innerHTML=`<div class="view">${html}</div>`;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.nav===key));
  updateCount();
  if(h.startsWith("item-")) bindItem(h.slice(5));
  if(h==="checkout") bindCheckout();
  if(h!=="home" || !location.hash.includes("how")) window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

      ? `You hit the ${Math.round(CAP*100)}% cap: it's yours to keep after ${t.label}. You save ${money(retail-tot)}.`
      : `You save ${money(retail-tot)} compared with buying new.`;
    const free=t.months>=DELIVERY.freeFromMonths || tot>DELIVERY.freeOverSubtotal;
    $("#qDeliv").className="deliv "+(free?"free":"fee");
    $("#qDeliv").textContent=free?"Free delivery, setup and pickup at this length.":`Under ${DELIVERY.freeFromMonths} months: ${money(DELIVERY.each)} delivery + ${money(DELIVERY.each)} pickup, unless your order is over ${money(DELIVERY.freeOverSubtotal)}.`;
  };
  r.addEventListener("input",upd); upd();
  $("#addBtn").addEventListener("click",()=>{
    const t=ts[+r.value].id;
    const ix = S.editIndex;
    if(ix!=null && S.cart[ix] && S.cart[ix].id===id){ S.cart[ix].tier=t; S.editIndex=null; toast("Rental length updated"); }
    else { S.cart.push({id,tier:t}); toast(`${g.name} added to cart`); }
    location.hash="cart";
  });
}

function bindCheckout(){
  $("#coForm").addEventListener("submit",e=>{
    e.preventDefault();
    const zip=$("#f-zip").value.trim(), okZip=/^20[0-5]\d\d$/.test(zip);
    $("#zipErr").hidden=okZip;
    if(!okZip){ $("#f-zip").focus(); return; }
    if(!$("#f-name").value.trim()||!$("#f-street").value.trim()){ toast("Add a name and street address"); return; }
    const date=new Date($("#f-date").value+"T00:00:00");
    if(isNaN(date)||date<addDays(today,3)){ toast("Pick a delivery date at least 3 days out"); return; }
    const o={num:"CB-"+Math.floor(10000+Math.random()*89999), name:$("#f-name").value.trim(), email:$("#f-email").value.trim()||"your email", street:$("#f-street").value.trim(), date, slot:document.querySelector('input[name=slot]:checked').value};
    S.cart.forEach(i=>{ const g=gear(i.id); (g.includes||[i.id]).forEach(id=>S.rentals.unshift({uid:++S.uid,id,tier:i.tier,start:date,status:"active",bundle:!!g.includes})); });
    S.cart=[]; S.lastOrder=o; location.hash="confirmed";
  });
}

/* ---------- logo roll on tap (touch screens have no hover) ---------- */
document.querySelector(".logo").addEventListener("touchstart",e=>{const l=e.currentTarget;l.classList.add("rolled");clearTimeout(l._t);l._t=setTimeout(()=>l.classList.remove("rolled"),2200);},{passive:true});

/* ---------- global clicks ---------- */
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-filter]"); if(f){ S.filter=f.dataset.filter; render(); return; }
  const rm=e.target.closest("[data-remove]"); if(rm){ S.cart.splice(+rm.dataset.remove,1); render(); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ const i=S.cart[+ed.dataset.edit]; S.editIndex=+ed.dataset.edit; S.pendingTier={[i.id]:TIERS.findIndex(t=>t.id===i.tier)}; return; }
  const a=e.target.closest("[data-act]"); if(a){ openAction(a.dataset.act,+a.dataset.uid); return; }
  if(e.target.closest("[data-close]")||e.target.classList.contains("scrim")){ $("#layer").innerHTML=""; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#layer").innerHTML=""; });

/* ---------- my-rentals actions ---------- */
function openAction(kind,uid){
  const r=S.rentals.find(x=>x.uid===uid), g=gear(r.id), t=tier(r.tier), end=addMonths(r.start,t.months);
  const remain=Math.max(0,Math.round((end-today)/(864e5*30)*10)/10);
  const paid=rentPrice(g,t);
  let body="";
  if(kind==="extend"){
    const opts=tiersFor(g).filter(x=>x.months>t.months).map((x,i)=>`<label class="opt"><span><input type="radio" name="ext" value="${x.id}" ${i===0?"checked":""}> Make it ${x.label}${hitsCap(g,x)?" (then it's yours)":""}</span><span class="num">+${money(rentPrice(g,x)-paid)}</span></label>`).join("");
    body=`<h2>Extend ${g.name.toLowerCase()}</h2><p class="muted">Currently ${t.label}, ending ${fmtDate(end)}. You only pay the difference to the longer rental's price, and you never pass ${Math.round(CAP*100)}% of the new price.</p><div class="opts">${opts}</div><div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="go">Extend rental</button></div>`;
  } else if(kind==="return"){
    const slots=[2,3,5].map((d,i)=>{const day=addDays(today,d);return `<label class="opt"><span><input type="radio" name="pk" value="${iso(day)}" ${i===0?"checked":""}> ${fmtDate(day)}</span><span class="muted">5 to 8 PM</span></label>`}).join("");
    body=`<h2>Schedule a free pickup</h2><p class="muted">We'll take the ${g.name.toLowerCase()} apart and carry it out. ${remain>=1?`You have about ${remain} months left. Unused full months come back as account credit.`:""}</p><div class="opts">${slots}</div><div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="go">Schedule pickup</button></div>`;
  } else {
    const n=gear(g.next), nt=tier("6m"), credit=Math.round(paid/t.months*remain), due=Math.max(0,rentPrice(n,nt)-credit);
    body=`<h2>Swap for the next stage</h2>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center">
        <div><div class="mini" style="width:72px;height:72px;margin:auto;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center">${icon(g.icon)}</div><b style="font-size:.9rem">${g.name}</b></div><b>→</b>
        <div><div class="mini" style="width:72px;height:72px;margin:auto;border-radius:14px;background:var(--pink-soft);display:grid;place-items:center">${icon(n.icon)}</div><b style="font-size:.9rem">${n.name}</b></div>
      </div>
      <p class="muted">One visit: we bring the ${n.name.toLowerCase()}, set it up and take the ${g.name.toLowerCase()} back.</p>
      <div class="sum">
        <div class="row"><span>${n.name}, ${nt.label}</span><span class="num">${money(rentPrice(n,nt))}</span></div>
        <div class="row"><span>Credit for unused ${g.name.toLowerCase()} time</span><span class="num">−${money(credit)}</span></div>
        <div class="row"><span>Swap visit</span><span>Free</span></div>
        <div class="row total"><span>Due today</span><span class="num">${money(due)}</span></div>
      </div>
      ${hitsCap(n,nt)?`<p class="save">The ${n.name.toLowerCase()} is yours to keep after ${nt.label}.</p>`:""}
      <div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn pink" id="go">Confirm swap</button></div>`;
  }
  $("#layer").innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;
  $("#go").addEventListener("click",()=>{
    if(kind==="extend"){ r.tier=document.querySelector('input[name=ext]:checked').value; toast(`Extended to ${fmtDate(addMonths(r.start,tier(r.tier).months))}`); }
    else if(kind==="return"){ r.status="pickup"; r.pickup=new Date(document.querySelector('input[name=pk]:checked').value+"T00:00:00"); toast("Pickup scheduled"); }
    else { const n=gear(g.next); r.status="returned"; S.rentals.unshift({uid:++S.uid,id:n.id,tier:"6m",start:addDays(today,3),status:"active"}); toast(`${n.name} arrives ${fmtDate(addDays(today,3))}`); }
    $("#layer").innerHTML=""; render();
  });
}

render();
</script>
</body>
</html>
